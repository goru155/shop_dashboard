[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "development"
  NPM_FLAGS = "--production=false"

[[redirects]]
  from = "/admin"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200